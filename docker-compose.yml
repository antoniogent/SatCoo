services:
  itu_postgres:
    image: postgres:15-alpine
    container_name: itu_postgres
    environment:
      POSTGRES_USER: itu_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itu_spectrum_db
    ports:
      # FIX SICUREZZA: prima era "5432:5432" (0.0.0.0), quindi raggiungibile
      # da chiunque su internet. Ora solo dal server stesso; il container
      # "app" ci arriva comunque via rete Docker interna (host "itu_postgres").
      - "127.0.0.1:5432:5432"
    volumes:
      - itu_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: itu_app
    ports:
      # FIX SICUREZZA: prima era "8501:8501" (0.0.0.0), raggiungibile
      # direttamente da tutto internet in HTTP semplice. Ora solo Caddy
      # (che gira nello stesso Docker network) ci parla; 127.0.0.1 resta
      # comodo per debug diretto dal server stesso, se mai serve.
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app    # <--- Questo collega la tua cartella locale in tempo reale
    env_file:
      - .env
    depends_on:
      - itu_postgres
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped

  webhook:
    build: .
    container_name: itu_webhook
    ports:
      # FIX SICUREZZA: prima era "8000:8000" (0.0.0.0). Ora solo Caddy ci
      # parla dall'esterno; 127.0.0.1 resta utile per "stripe listen
      # --forward-to localhost:8000/..." durante test futuri in locale.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 stripe_webhook:app
    restart: unless-stopped
    # niente depends_on su itu_postgres: il webhook parla solo con
    # Supabase e Stripe via internet, non con il Postgres degli ITU filing

  caddy:
    image: caddy:2-alpine
    container_name: itu_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - webhook
    restart: unless-stopped

volumes:
  itu_pgdata:
  caddy_data:
  caddy_config:
